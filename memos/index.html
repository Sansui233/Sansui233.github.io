ildren: \\\"我的梦想已经从下班能画画变成下班能有时间写代码然后思考一下人生了。我觉得非常痛苦的时候躺在地上凉凉的会很舒服，好像自己足够低，足够自然。\\\"\\n    }), \\\"\\\\n\\\", _jsx(_components.p, {\\n      children: \\\"对于那些胡搅蛮缠的客户我实在没什么情绪，我的嘴和真实感受并不一致，他们骂就骂吧，事实也不会改变什么，规则的执行本身就是为了避免人为的干扰。我像是一个观测者一样站在那里，满足不了就机械性地不好意思，也没有别的感觉。这都不是 T 人还是 F 人的问题，只是在夜晚一个人时那样的痛苦比例尺前那样莫名其妙的指责不值一提。\\\"\\n    }), \\\"\\\\n\\\", _jsx(_components.p, {\\n      children: \\\"我躺在地板上时又一次冒出了想从这个栏杆跳下去的冲动，吓了一跳。\\\"\\n    }), \\\"\\\\n\\\", _jsx(_components.p, {\\n      children: \\\"不过这事很早时就和已经被我当心理医生的陈 Sir 说过。他是建议我先做以先让齿轮运转起来。确实是没有问题的，至少不是在想为什么要活着了。他至少在两个非常重要的时刻帮助过我两次，一次是真的让我教了结业论文。第二次是就是前几个月，虽然并没有帮我写论文，可以说能我毕业和他关系非常大。不同的人可能对此会有完全不同的建议，我也很感谢所有人。只是客观来说，陈 Sir 的建议算是比较明白我的情况本质的。不过他自己也有不太好的心理问题，正常人不会想这些，但是医者无法自医，很遗憾我经历的一切不足以帮到他。\\\"\\n    }), \\\"\\\\n\\\", _jsx(_components.p, {\\n      children: \\\"找工作我以前的原则是进以本专业为核心的企业，进尽可能大的平台。事与愿违就算了，好像我关乎于人生的大愿望也没被满足过。\\\"\\n    }), \\\"\\\\n\\\", _jsx(_components.p, {\\n      children: _jsx(_components.strong, {\\n        children: \\\"缺点：\\\"\\n      })\\n    }), \\\"\\\\n\\\", _jsxs(_components.ul, {\\n      children: [\\\"\\\\n\\\", _jsx(_components.li, {\\n        children: \\\"地方小，人脉关系严重，技术能力与解决问题的能力被严重稀释，无法发挥自身\\\"\\n      }), \\\"\\\\n\\\", _jsx(_components.li, {\\n        children: \\\"地方小，上限低\\\"\\n      }), \\\"\\\\n\\\", _jsx(_components.li, {\\n        children: \\\"行业落后，完全不自动化，连证书都是手敲的，所以我名字被敲错了\\\"\\n      }), \\\"\\\\n\\\", _jsx(_components.li, {\\n        children: \\\"接触不到前沿，幸福感很差\\\"\\n      }), \\\"\\\\n\\\", _jsxs(_components.li, {\\n        children: [\\\"网极其差。我第一次见 ping 1.1.1.1 和国外服务器丢包率到 50% 的\\\\n\\\", _jsx(_components.strong, {\\n          children: \\\"好处：\\\"\\n        })]\\n      }), \\\"\\\\n\\\", _jsx(_components.li, {\\n        children: \\\"生活无忧，当地龙头企，六险二金全顶格。目前是属于有钱也租不到满意的房子，因为地方太差了没年轻人，都老房子闲置出租，房子没人装修。\\\"\\n      }), \\\"\\\\n\\\", _jsx(_components.li, {\\n        children: \\\"休假正常，休息天数比一般人多出了5%。一个月可以稳定休 10 天。\\\"\\n      }), \\\"\\\\n\\\"]\\n    }), \\\"\\\\n\\\", _jsx(_components.p, {\\n
